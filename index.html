document.addEventListener("visibilitychange", function(){
    if(examStarted && document.hidden) terminateExam("ตรวจพบการเปลี่ยนแท็บหรือออกจากหน้าต่างแบบฝึกหัด");
});

window.addEventListener("blur", function(){
    if(examStarted) terminateExam("ตรวจพบการเปลี่ยนหน้าต่าง");
});

document.addEventListener("keydown", function(e){
    if(!examStarted) return;
    if(e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")){
        e.preventDefault();
        terminateExam("ตรวจพบการรีเฟรชหน้าเว็บ");
    }
});

window.addEventListener("beforeunload", function(e){
    if(examStarted){ e.preventDefault(); e.returnValue = ""; }
});

history.pushState(null, "", location.href);
window.addEventListener("popstate", function(){
    terminateExam("ตรวจพบการกดย้อนกลับ");
});

function terminateExam(msg){
    document.body.innerHTML = `
        <div class="terminated">
            <h1 style="color:red;">สิ้นสุดการทำแบบฝึกหัด</h1>
            <p>${msg}</p>
        </div>`;
}

function startExam(){
    const name = document.getElementById("name").value.trim();
    const number = document.getElementById("number").value.trim();

    if(!name || !number){
        alert("กรุณากรอกชื่อและเลขที่ / รหัสนักเรียนให้ครบถ้วน");
        return;
    }

    examStarted = true;
    document.getElementById("studentName").textContent = name;
    document.getElementById("studentNumber").textContent = number;
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("examPage").style.display = "block";
}

function typesetQuestion(){
    if(window.MathJax && typeof MathJax.typesetPromise === "function"){
        MathJax.typesetClear([document.getElementById("questionBox")]);
        MathJax.typesetPromise([document.getElementById("questionBox")]).catch(()=>{});
    }
}

function generateQuestion(){
    if(count >= 10) return;
    const topicOrder = ["direct","factor","conjugate","absolute","continuity"];
    const currentTopic = topicOrder[Math.floor(count / 2)];
    const candidates = questionBank.filter(q => q.topic === currentTopic && !usedQuestions.some(u => u.q === q.q));
    if(candidates.length === 0){ alert("ไม่พบโจทย์ที่ยังไม่ถูกสุ่มในหัวข้อนี้"); return; }
    const question = candidates[Math.floor(Math.random() * candidates.length)];
    usedQuestions.push(question);
    count++;
    document.getElementById("count").innerText = count;
    document.getElementById("questionBox").innerHTML = `<div>${question.q}</div>`;
    typesetQuestion();
    if(count >= 10){
        document.getElementById("randomBtn").disabled = true;
        document.getElementById("randomBtn").innerText = "ครบ 10 ข้อแล้ว";
    }
}
